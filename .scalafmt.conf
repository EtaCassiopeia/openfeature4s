version = "3.7.17"
runner.dialect = scala3
maxColumn = 120
indent.main = 2
indent.callSite = 2
indent.defnSite = 2
align.preset = more
rewrite.rules = [RedundantBraces, RedundantParens, SortModifiers]
rewrite.scala3.convertToNewSyntax = true
rewrite.scala3.removeOptionalBraces = true

fileOverride {
  # Cross-compiled modules: shared scala/ dirs use Scala 2.13-compatible syntax;
  # Scala 3 syntax lives in scala-3/ dirs (picked up by the top-level dialect = scala3).
  "glob:**/scala-2/**" {
    runner.dialect = scala213
    rewrite.scala3.convertToNewSyntax = false
    rewrite.scala3.removeOptionalBraces = false
  }
  "glob:**/src/main/scala/**" {
    runner.dialect = scala213
    rewrite.scala3.convertToNewSyntax = false
    rewrite.scala3.removeOptionalBraces = false
  }
  "glob:**/src/test/scala/**" {
    runner.dialect = scala213
    rewrite.scala3.convertToNewSyntax = false
    rewrite.scala3.removeOptionalBraces = false
  }
}
